services:
  # ── 0. Bind-mount ownership fixer ──────────────────────────
  # Docker creates bind-mount dirs as root when they don't exist on the
  # host. The backend container runs as appuser (uid 1000) and would fall
  # back to a container-internal DB path when /app/data is root-owned,
  # hiding the agenthub.db from the host. This one-shot sidecar fixes
  # the ownership before the backend starts. Running as uid 0 is the only
  # way to chown a path we don't own; it exits immediately after.
  data-dir-init:
    image: alpine:3
    user: "0"
    volumes:
      - ./Backend/.data:/data
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /data && echo 'data-dir-init: /data owned by 1000:1000'"]
    restart: "no"

  # ── 1. Generate the manifest package (.nupkg) ──────────────
  # Runs once at startup, writes the package to a shared volume.
  manifest-generator:
    build:
      context: Backend
      target: production
      dockerfile: Dockerfile
    user: "0"   # run as root — one-shot job needs to write to the named volume
    env_file:
      - .env
    volumes:
      - manifest-pkg:/app/bin/Debug
      - ./Backend/tools:/app/tools:ro
      # Mount the manifest templates (WorkloadManifest.xml, AgentHubItem.xml, *.nuspec)
      # so edits on the host are picked up on the next `docker compose up`
      # without needing an image rebuild.
      - ./Backend/manifest:/app/manifest:ro
      - ./Frontend/Package:/Frontend/Package:ro
    command: >
      python3 tools/manifest_package_generator.py
        --version 1.0.0
        --project-root /app

  # ── 2. Backend (Python / FastAPI) ──────────────────────────
  backend:
    build:
      context: Backend
      target: production
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      PYTHON_ENVIRONMENT: Development
      # Single source of truth for the SQLite path. Container-only concern,
      # so it lives here (not in .env) — the host-side ./Backend/.data bind
      # mount below makes the DB file visible from your editor.
      AGENTHUB_DB_PATH: /app/data/agenthub.db
      # Force ANSI colours in log output even though the container has no
      # TTY. ``docker compose logs`` and most terminals render the ANSI
      # escape codes, which makes ERROR lines pop red in the log stream.
      FORCE_COLOR: "1"
      PYTHONUNBUFFERED: "1"
      # Local observability: 100% sampled traces and support-grade mission
      # events persisted to the bind-mounted ./Backend/.data folder. Keep
      # stdout export off so docker logs stay readable.
      AGENTHUB_OTEL_ENABLED: "1"
      AGENTHUB_OTEL_SAMPLE_RATE: "1.0"
      AGENTHUB_OTEL_CONSOLE_EXPORTER: "0"
      AGENTHUB_OTEL_TRACE_FILE: /app/data/otel-traces.jsonl
      AGENTHUB_EVENT_LEDGER_FILE: /app/data/agenthub-events.jsonl
      OTEL_SERVICE_NAME: fabric-clawhub-backend
      # Tell MCPClientManager where to resolve ``${REPO_DIR}/mcp/...``
      # references inside the container. We mount the host's repo-root
      # ``mcp/`` directory at ``/opt/agenthub-mcp/mcp`` (see ``volumes``
      # below) — we cannot mount it at ``/app/mcp`` because that name
      # would shadow the installed ``mcp`` Python SDK package.
      MCP_REPO_DIR: /opt/agenthub-mcp
    volumes:
      # Mount source for hot reload (uvicorn --reload watches these)
      - ./Backend/src:/app/src
      - ./Backend/src/appsettings.json:/app/src/appsettings.json:ro
      - ./Backend/src/appsettings.Development.json:/app/src/appsettings.Development.json:ro
      # Persist the AgentHub SQLite DB to the host so you can inspect it
      # directly (./Backend/.data/agenthub.db). Folder is gitignored.
      - ./Backend/.data:/app/data
      # Mount the host .env so bootstrap.py can locate + log it (the values
      # are also injected via env_file: above; this mount just makes the
      # file visible inside the container for transparency / debugging).
      - ./.env:/app/.env:ro
      # Mount the repo-root ``mcp/`` directory (shared Python MCP servers:
      # pbi_fixer, pbir_tools) at ``/opt/agenthub-mcp/mcp`` so
      # ``${REPO_DIR}/mcp/...`` references in ``src/mcp_servers.json``
      # resolve inside the container (see ``MCP_REPO_DIR`` above).
      # NOTE: must NOT be mounted at ``/app/mcp`` — that path would
      # shadow the installed ``mcp`` Python SDK package and break imports.
      - ../mcp:/opt/agenthub-mcp/mcp:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      data-dir-init:
        condition: service_completed_successfully

  # ── 3. Frontend ───────────────────────────────────────────
  #
  # Two modes, selected by compose profiles:
  #
  #   DEFAULT (no profile): production build — multi-stage Dockerfile
  #   compiles a static bundle and serves it from nginx. Zero host
  #   prerequisites, ~30 MB image, no HMR. This is what non-dev users get.
  #
  #     docker compose up
  #
  #   DEV PROFILE: webpack-dev-server with hot-reload. Requires host
  #   Node for fast iteration. Bind-mounts host node_modules.
  #
  #     # one-time (or whenever package-lock.json changes):
  #     (cd Frontend && npm ci)
  #     docker compose --profile dev up
  #
  frontend:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Frontend/Dockerfile
      target: production
    ports:
      - "60006:60006"
    env_file:
      - .env
    environment:
      # Nginx substitutes these into default.conf.template at startup to
      # serve /manifests_new/metadata (the Fabric-host-facing JSON). Defaults
      # keep the container functional even when the .env values are absent.
      # The ${FOO:-$BAR} fallbacks match webpack-dev-server's precedence so
      # prod and dev return identical metadata for the same .env.
      WORKLOAD_NAME: "${WORKLOAD_NAME:-}"
      FRONTEND_AAD_AUDIENCE: "${DEV_AAD_CONFIG_AUDIENCE:-${AUDIENCE:-}}"
      FRONTEND_AAD_APPID: "${DEV_AAD_CONFIG_APPID:-${CLIENT_ID:-}}"
      FRONTEND_AAD_REDIRECT_URI: "${DEV_AAD_CONFIG_REDIRECT_URI:-http://localhost:60006/close}"
    volumes:
      # Fabric host fetches /manifests_new (the workload package) and
      # /manifests_new/metadata (AAD app config). Nginx serves the nupkg
      # directly from this mounted volume; the metadata JSON is rendered
      # inline from env vars (see Frontend/tools/default.conf.template).
      - manifest-pkg:/usr/share/nginx/html/manifests_new:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:60006/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
      manifest-generator:
        condition: service_completed_successfully

  frontend-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Frontend/Dockerfile
      target: dev
    ports:
      - "60006:60006"
    env_file:
      - .env
    environment:
      # Raise Node's old-space cap. webpack-dev-server with HMR keeps a
      # snapshot of the module graph per rebuild in memory; over a long
      # editing session (many hot-reloads) the 4 GB default was being hit.
      # 6 GB gives comfortable headroom and the host easily has it.
      NODE_OPTIONS: "--max-old-space-size=6144"
      # Force ANSI color in our custom webpack infrastructure logger
      # (webpack.config.js) even though stdout isn't a TTY under
      # docker-compose. Keeps the log stream visually consistent with the
      # backend's ColorFormatter.
      FORCE_COLOR: "1"
    volumes:
      - ./Frontend/src:/app/src
      - ./Frontend/tools:/app/tools
      - ./Frontend/Package:/app/Package
      # Host-installed node_modules. Run `npm ci` in Frontend/ first.
      - ./Frontend/node_modules:/app/node_modules
      - ./Frontend/package.json:/app/package.json:ro
      - ./Frontend/package-lock.json:/app/package-lock.json:ro
      - manifest-pkg:/app/../Backend/bin/Debug:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:60006/',r=>{r.resume();process.exit(r.statusCode<400?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      backend:
        condition: service_healthy
      manifest-generator:
        condition: service_completed_successfully

  # ── 4. DevGateway (registers workload with Fabric) ────────
  # Token flow: if DEVGATEWAY_TOKEN is set (from host `az` CLI), it is used
  # directly and device-code login is skipped. Otherwise falls back to
  # interactive device-code auth inside the container.
  #
  # Quick start (no device-code prompt):
  #   export DEVGATEWAY_TOKEN=$(az account get-access-token \
  #     --scope https://analysis.windows.net/powerbi/api/.default \
  #     --query accessToken -o tsv)
  #   docker compose up
  dev-gateway:
    # Microsoft distributes the Fabric DevGateway binary as x64-only.
    # ARM64 hosts need amd64 binfmt emulation registered before running this.
    platform: linux/amd64
    build:
      context: tools/DevGatewayContainer
      dockerfile: Dockerfile
    user: "0"
    env_file:
      - .env
    environment:
      ENTRA_TENANT_ID: ${PUBLISHER_TENANT_ID}
      WORKSPACE_GUID: ${WORKSPACE_GUID}
      LOCAL_BACKEND_PORT: ${PORT:-5000}
      # Set on the host to skip device-code login:
      #   export DEVGATEWAY_TOKEN=$(az account get-access-token --scope https://analysis.windows.net/powerbi/api/.default --query accessToken -o tsv)
      DEVGATEWAY_TOKEN: ${DEVGATEWAY_TOKEN:-}
    volumes:
      - manifest-pkg:/app/manifest:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        cp /app/manifest/ManifestPackage.1.0.0.nupkg /app/ManifestPackage.nupkg

        # ── Try host-provided token first ──
        if [ -n "$$DEVGATEWAY_TOKEN" ]; then
          echo "✅ Using token from host environment (DEVGATEWAY_TOKEN)"
          token="$$DEVGATEWAY_TOKEN"
        else
          echo "══════════════════════════════════════════════════════════"
          echo "  No DEVGATEWAY_TOKEN set — falling back to device-code  "
          echo "══════════════════════════════════════════════════════════"

          # Authenticate to Azure
          if ! az account show > /dev/null 2>&1; then
            az config set core.login_experience_v2=off
            az login -t "$$ENTRA_TENANT_ID" --allow-no-subscriptions --use-device-code
          fi

          token=$$(az account get-access-token \
            --scope https://analysis.windows.net/powerbi/api/.default \
            --query accessToken -o tsv)
        fi

        if [ -z "$$token" ]; then
          echo "ERROR: Failed to obtain Azure access token."
          echo "  Either set DEVGATEWAY_TOKEN on the host, or complete device-code login."
          exit 1
        fi

        # Pipe DevGateway stdout/stderr through sed so its log format
        # matches the backend / frontend pattern. We cannot use ``exec``
        # with a pipe — the pipeline needs a shell — so dotnet runs as a
        # child process and we forward its exit status manually.
        dotnet DevGateway/Microsoft.Fabric.Workload.DevGateway.dll \
          -LogLevel "$$LOG_LEVEL" \
          -DevMode:UserAuthorizationToken "$$token" \
          -DevMode:ManifestPackageFilePath /app/ManifestPackage.nupkg \
          -DevMode:WorkspaceGuid "$$WORKSPACE_GUID" \
          -DevMode:WorkloadEndpointUrl "http://host.docker.internal:$${LOCAL_BACKEND_PORT}/workload" \
          2>&1 | sed -u -E \
            -e "s/^\[([0-9]{2})\/([0-9]{2}) ([0-9:]{8})\.[0-9]+\] info: /$$(date +%Y)-\2-\1 \3 - dev-gateway - INFO - /" \
            -e "s/^\[([0-9]{2})\/([0-9]{2}) ([0-9:]{8})\.[0-9]+\] warn: /$$(date +%Y)-\2-\1 \3 - dev-gateway - WARNING - /" \
            -e "s/^\[([0-9]{2})\/([0-9]{2}) ([0-9:]{8})\.[0-9]+\] (err|error|fail): /$$(date +%Y)-\2-\1 \3 - dev-gateway - ERROR - /" \
            -e "s/^\[([0-9]{2})\/([0-9]{2}) ([0-9:]{8})\.[0-9]+\] (dbug|debug|trce|trace): /$$(date +%Y)-\2-\1 \3 - dev-gateway - DEBUG - /"
    tty: true
    stdin_open: true
    depends_on:
      manifest-generator:
        condition: service_completed_successfully

volumes:
  manifest-pkg:
