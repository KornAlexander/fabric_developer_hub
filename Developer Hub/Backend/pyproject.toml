[project]
name = "agenthub-backend"
version = "0.1.0"
description = "Fabric AgentHub backend — FastAPI service that registers with Fabric DevGateway and orchestrates agent workloads."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    # HTTP clients
    "httpx>=0.28",
    "requests>=2.32",
    "aiohttp>=3.11",
    # Local observability / tracing
    "opentelemetry-api>=1.31",
    "opentelemetry-sdk>=1.31",
    "opentelemetry-instrumentation-fastapi>=0.52b0",
    "opentelemetry-instrumentation-httpx>=0.52b0",
    "opentelemetry-instrumentation-requests>=0.52b0",
    "opentelemetry-instrumentation-aiohttp-client>=0.52b0",
    "opentelemetry-instrumentation-sqlite3>=0.52b0",
    # Data validation
    "pydantic>=2",
    # Auth
    "msal>=1.32",
    "python-jose[cryptography]>=3.4",
    # Config / IO
    "python-dotenv>=1.0",
    "aiofiles>=23",
    # Agent tooling
    "mcp>=1.0",
    "docker>=7.1",
    # Runtime dependencies for the vendored Power BI Design MCP server
    # (tmdaidevs/powerbi-creator-skill/mcp-server), hosted by the backend
    # MCP runtime container/process.
    "fastmcp>=0.2.0",
    "pydantic-settings>=2.2.1",
    "structlog>=24.1.0",
    "tenacity>=8.2.3",
    "cachetools>=5",
    # Declarative capability catalog (skills + agent → skill mapping)
    "pyyaml>=6",
    # Attachment parsing (PDF text extraction for prompt attachments)
    "pypdf>=5.0",
    # Multi-agent orchestration — Microsoft Agent Framework is the sole
    # topology engine. See services/agenthub/drivers/maf/ and
    # ORCHESTRATION_CONCEPT.md.
    "agent-framework>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.2",
    "black>=24.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Pytest ─────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = ["-v", "--tb=short", "--strict-markers", "--cov=src", "--cov-report=term-missing", "--cov-fail-under=85"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "smoke: Smoke tests for CI/CD",
    "controllers: Controller layer tests",
    "services: Service layer tests",
    "api: API endpoint tests",
    "models: Model and domain entity tests",
]
filterwarnings = [
    "ignore::pytest.PytestUnknownMarkWarning",
    "ignore::PendingDeprecationWarning",
]

# ── Coverage ───────────────────────────────────────────────────────
# Exclude auto-generated OpenAPI code and app-level entry points that are
# exercised only by the live uvicorn process (not by unit tests).
[tool.coverage.run]
source = ["src"]
omit = [
    # OpenAPI-generated — no hand-written logic to cover.
    "src/fabric_api/apis/*",
    "src/fabric_api/models/*",
    # FastAPI bootstrap / lifespan; covered by integration smoke tests, not unit.
    "src/main.py",
    "src/app/bootstrap.py",
    "src/app/core/service_initializer.py",
    # Runtime adapters and live process entry points. These are covered by
    # integration/E2E smoke paths, while unit coverage targets deterministic
    # domain and service logic.
    "src/api/agenthub_controller.py",
    "src/api/github_chat_controller.py",
    "src/api/internal_agent_api.py",
    "src/api/onelake_controller.py",
    "src/mcp_servers/*",
    "src/services/agenthub/agent/*",
    "src/services/agenthub/drivers/base.py",
    "src/services/agenthub/drivers/container_*.py",
    "src/services/agenthub/orchestrator_engine.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "pragma: no cover",
]

# ── Formatting / Linting ───────────────────────────────────────────
[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py313"
# OpenAPI-generated code — don't lint or auto-edit.
extend-exclude = [
    "src/fabric_api/apis",
    "src/fabric_api/models",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",
    # FastAPI's dependency-injection idiom requires ``param: T = Depends(...)``
    # in default args. ruff flags every DI site; documented pattern, not a bug.
    "B008",
    # mcp_servers/*.py are standalone stdio subprocesses that have to insert
    # the ``src/`` path onto ``sys.path`` before importing sibling modules.
    # Those imports are intentionally after ``sys.path.insert(...)``.
    "E402",
    # Abstract base classes commonly define empty default-hook methods
    # (e.g. ``def on_initialized(self) -> None: pass``) for subclasses to
    # override. ``@abstractmethod`` would be wrong — the hook is *optional*.
    "B027",
]

# ── Mypy ───────────────────────────────────────────────────────────
# Targeted strict checking on the well-typed domain layer; permissive
# elsewhere until the codebase catches up.
[tool.mypy]
python_version = "3.13"
files = ["src"]
# Pydantic's mypy plugin teaches mypy about ``Field(alias=...)`` +
# ``populate_by_name=True`` so snake_case field names keep working as
# constructor kwargs even when the model declares a camelCase alias
# (which the OpenAPI-generated models in ``fabric_api/models/`` do).
plugins = ["pydantic.mypy"]
# ``src/`` is the import root at runtime (see ``[tool.pyright]`` below).
# Without ``mypy_path`` + ``explicit_package_bases``, mypy discovers
# ``src/fabric_api/impl/jobs_controller.py`` under both ``impl.jobs_controller``
# and ``fabric_api.impl.jobs_controller`` because ``fabric_api/`` has no
# ``__init__.py``. Telling mypy the package root explicitly resolves the
# ambiguity.
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
exclude = ["src/fabric_api/apis", "src/fabric_api/models"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["domain.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true

# Third-party libraries that ship without type stubs and for which the
# corresponding ``types-*`` package isn't installed in this environment.
# ``import-untyped`` is a distinct error code from ``import-not-found`` —
# the library is importable, it just has no type annotations.
[[tool.mypy.overrides]]
module = ["aiofiles", "aiofiles.*", "cachetools", "cachetools.*"]
ignore_missing_imports = true
follow_imports = "skip"

# The OpenAPI-generated scaffolding under ``fabric_api/impl`` ships with
# drifted annotations (implicit Optional defaults, ``no_implicit_optional``
# incompatibilities, signature mismatches with the hand-authored
# ``fabric_api/apis`` base classes). These files are regenerated from the
# OpenAPI spec via ``tools/ManifestGeneratorTool.md`` and should be fixed
# at the generator level, not hand-edited. Relax the rules here so those
# 40 errors don't mask real problems elsewhere.
[[tool.mypy.overrides]]
module = ["fabric_api.impl.*"]
no_implicit_optional = false
# Keep import-checking on so we catch typos in cross-module references.
ignore_errors = true

# ── Pyright / Pylance ──────────────────────────────────────────────
# `src/` is the import root at runtime (uvicorn runs from src, pytest sets
# pythonpath=["src"]). Tell Pylance so "from core.X import Y" resolves in editor.
[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
