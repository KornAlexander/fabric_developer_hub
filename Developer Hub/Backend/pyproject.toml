[project]
name = "agenthub-backend"
version = "0.1.0"
description = "Fabric AgentHub backend — FastAPI service that registers with Fabric DevGateway and orchestrates agent workloads."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    # HTTP clients
    "httpx>=0.28",
    "requests>=2.32",
    "aiohttp>=3.11",
    # Data validation
    "pydantic>=2",
    # Auth
    "msal>=1.32",
    "python-jose[cryptography]>=3.4",
    # Config / IO
    "python-dotenv>=1.0",
    "aiofiles>=23",
    # Agent tooling
    "mcp>=1.0",
    "cachetools>=5",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.2",
    "black>=24.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Pytest ─────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = ["-v", "--tb=short", "--strict-markers", "--cov=src", "--cov-report=term-missing", "--cov-fail-under=65"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "smoke: Smoke tests for CI/CD",
    "controllers: Controller layer tests",
    "services: Service layer tests",
    "api: API endpoint tests",
    "models: Model and domain entity tests",
]
filterwarnings = [
    "ignore::pytest.PytestUnknownMarkWarning",
    "ignore::PendingDeprecationWarning",
]

# ── Formatting / Linting ───────────────────────────────────────────
[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py313"
# OpenAPI-generated code — don't lint or auto-edit.
extend-exclude = [
    "src/fabric_api/apis",
    "src/fabric_api/models",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

# ── Mypy ───────────────────────────────────────────────────────────
# Targeted strict checking on the well-typed domain layer; permissive
# elsewhere until the codebase catches up.
[tool.mypy]
python_version = "3.13"
files = ["src"]
exclude = ["src/fabric_api/apis", "src/fabric_api/models"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["domain.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true

# ── Pyright / Pylance ──────────────────────────────────────────────
# `src/` is the import root at runtime (uvicorn runs from src, pytest sets
# pythonpath=["src"]). Tell Pylance so "from core.X import Y" resolves in editor.
[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
