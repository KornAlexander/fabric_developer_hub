# AgentHub capability catalog — declarative source of truth.
#
# This file replaces the hardcoded `SKILLS` and `_AGENT_SKILLS` dicts that
# used to live in `agent_registry.py`. The loader in
# `services/agenthub/catalog_loader.py` parses this file at import time and
# exposes the same module-level names, so all downstream code (compose
# LLM, tool runtime, tests) continues to work unchanged.
#
# Structure:
#   skills:       map of skill-id → Skill fields (matches domain.models.skill.Skill)
#   agent_skills: map of agent-id → list of skill-ids
#
# This file does NOT contain full agent definitions. Agent prompts,
# boundaries, display metadata, and upstream origin are defined in
# `services/agenthub/agent_registry.py`; this YAML only binds those
# agents to skill ids and binds skills to MCP tool names.
#
# This file also does NOT define where a tool comes from. Tool origin is
# runtime-discovered from `src/mcp_servers.json` by `MCPClientManager`:
#   * tool name → MCP server id is exposed by `/api/catalogs/tools`
#   * log/error output can render `server_id::tool_name` via
#     `MCPClientManager.qualified_name(...)`
#
# Validation runs at startup via `services.agenthub.capability_registry`:
#   * every tool a skill declares must be provided by a running MCP server
#   * every skill an agent declares must exist in the `skills:` map
# Any missing tool, missing skill, or unbound discovered MCP tool fails
# startup so agents never run with a partial diagnostic/tool surface.

skills:

  # ── From skills-for-fabric (10) ──────────────────────────────────
  # SfF takes precedence on overlap with AnalyticsPlatformAgents.

  spark-authoring-cli:
    name: Spark authoring
    description: >-
      Build Fabric Spark / data engineering workflows: notebook development,
      Lakehouse management, PySpark engineering, Livy sessions, Delta Lake
      patterns.
    tools:
      - fabric_list_workspaces
      - fabric_list_items
      - fabric_list_folders
      - fabric_diagnose_workspace_artifacts
      - fabric_create_item
      - fabric_create_workspace_inventory_solution
      - fabric_create_folder
      - fabric_delete_item
      - fabric_list_files
      - fabric_read_file
      - fabric_write_file
      - fabric_delete_file
      - fabric_create_directory
      - sl_list_lakehouses
      - sl_get_lakehouse_tables
      - sl_run_table_maintenance
      - sl_list_shortcuts
      - sl_create_shortcut
      - sl_list_data_pipelines
      - sl_run_data_pipeline
      - sl_get_notebook_definition
    applicable_when: >-
      Develop notebooks, design data pipelines, organise Lakehouse tables,
      or provision Spark data-engineering artefacts.

  spark-consumption-cli:
    name: Spark consumption
    description: >-
      Analyse Lakehouse data interactively with PySpark / Spark SQL —
      DataFrames, cross-lakehouse joins, Delta time-travel, JSON
      exploration.
    tools:
      - fabric_list_workspaces
      - fabric_list_items
      - fabric_list_files
      - fabric_read_file
      - sl_list_lakehouses
      - sl_get_lakehouse_tables
    applicable_when: >-
      User explicitly wants PySpark, Spark DataFrames, or a Livy session
      to explore lakehouse data.

  sqldw-authoring-cli:
    name: Warehouse / SQL authoring
    description: >-
      Author T-SQL against Fabric Warehouse and Lakehouse SQL endpoints:
      DDL, DML, COPY INTO, stored procedures, schema evolution, ETL/ELT
      scripting.
    tools:
      - fabric_list_workspaces
      - fabric_list_items
      - fabric_list_folders
      - fabric_diagnose_workspace_artifacts
      - fabric_create_item
      - fabric_create_folder
      - fabric_delete_item
      - sl_list_warehouses
      - sl_list_sql_endpoints
    applicable_when: >-
      Create / alter / drop warehouse tables, load data via T-SQL, or
      stand up stored procedures.

  sqldw-consumption-cli:
    name: Warehouse / SQL consumption
    description: >-
      Run read-only T-SQL against Warehouse, Lakehouse SQL endpoints and
      Mirrored Databases. Default for any lakehouse data query that isn't
      explicitly PySpark.
    tools:
      - fabric_list_workspaces
      - fabric_list_items
      - sl_list_warehouses
      - sl_list_sql_endpoints
      - sl_list_mirrored_databases
      - sl_get_mirroring_status
    applicable_when: >-
      Query warehouse / lakehouse data, count rows, explore tables, or
      monitor SQL performance.

  eventhouse-authoring-cli:
    name: Eventhouse authoring
    description: >-
      Execute KQL management commands against Eventhouse / KQL Databases:
      table management, ingestion, policies, functions, materialised views.
    tools:
      - fabric_list_workspaces
      - fabric_list_items
      - fabric_list_folders
      - fabric_diagnose_workspace_artifacts
      - fabric_create_item
      - fabric_create_folder
      - fabric_delete_item
    applicable_when: >-
      Create or alter KQL tables, ingest into Eventhouse, or configure
      retention / materialised views.

  eventhouse-consumption-cli:
    name: Eventhouse consumption
    description: >-
      Run read-only KQL queries against Eventhouse / KQL Databases for
      real-time intelligence and time-series analytics.
    tools:
      - fabric_list_workspaces
      - fabric_list_items
    applicable_when: >-
      Query real-time / time-series KQL data or explore Eventhouse schema.

  powerbi-authoring-cli:
    name: Power BI authoring
    description: >-
      Create and deploy Power BI semantic models (TMDL), manage refresh
      and permissions, author reports, and run the PBIR tool surface for
      CI/CD. Semantic-model creation/publish must be performed with the
      delegated mission user's OBO identity; app-registration/service-principal
      ownership is a blocker, not something to heal after creation.
    tools:
      - fabric_list_items
      - fabric_list_folders
      - fabric_diagnose_workspace_artifacts
      - fabric_create_item
      - fabric_create_folder
      - fabric_delete_item
      - fabric_definition_checkout
      - fabric_definition_list_files
      - fabric_definition_diff
      - fabric_definition_validate
      - fabric_definition_plan_publish
      - fabric_definition_publish
      - fabric_definition_discard_checkout
      - sl_list_semantic_models
      - sl_get_semantic_model_definition
      - sl_get_semantic_model_tables
      - sl_deploy_semantic_model
      - sl_refresh_semantic_model
      - sl_get_refresh_history
      - fabric_get_semantic_model_refresh_history
      - sl_cancel_refresh
      - sl_set_endorsement
      - sl_list_reports
      - sl_get_report_definition
      - sl_create_report_from_reportjson
      - sl_clone_report
      - sl_rebind_report
      - sl_export_report
      - pbir_new_report
      - pbir_add
      - pbir_cp
      - pbir_mv
      - pbir_set
      - pbir_rm
      - pbir_visuals
      - pbir_pages
      - pbir_fields
      - pbir_filters
      - pbir_dax
      - pbir_bookmarks
      - pbir_annotations
      - pbir_theme
      - pbir_schema
      - pbir_validate
      - pbir_download
      - pbir_publish
      - pbir_report
      - pbir_batch
      - pbir_backup
      - pbir_restore
    applicable_when: >-
      Create semantic models, deploy TMDL, trigger refresh, or author /
      modify Power BI reports programmatically.

  powerbi-consumption-cli:
    name: Power BI consumption
    description: >-
      Query semantic models with DAX (EVALUATE) and discover metadata —
      tables, columns, measures, relationships.
    tools:
      - fabric_list_items
      - fabric_diagnose_workspace_artifacts
      - sl_evaluate_dax
      - sl_list_semantic_models
      - sl_get_semantic_model_tables
      - sl_get_semantic_model_definition
      - sl_list_reports
      - sl_get_report_definition
      - sl_get_refresh_history
      - fabric_get_semantic_model_refresh_history
    applicable_when: >-
      Run a DAX query, inspect a semantic model, or list measures /
      tables.

  fabric-verification:
    name: Fabric verification super skill
    description: >-
      Verify created Fabric and Power BI deliverables against the original
      task: capacity readiness, item existence, semantic-model data,
      Lakehouse tables, PBIR/report definitions, report renderability, and
      browser screenshot evidence. For Power BI reports, this is a strict
      UI/UX gate: judge championship-caliber hierarchy, 3-30-300 storytelling,
      interactions, methodology/source transparency, accessibility, theme,
      naming, model clarity, and usability unless the user explicitly asked
      for lower-fidelity styling or supplied another sample to mimic.
    tools:
      - fabric_list_workspaces
      - fabric_list_items
      - fabric_list_folders
      - fabric_validate_workspace_capacity
      - fabric_diagnose_workspace_artifacts
      - fabric_verify_report_renderable
      - fabric_verify_workspace_inventory_solution
      - fabric_get_semantic_model_refresh_history
      - browser_verify_visual_render
      - fabric_definition_checkout
      - fabric_definition_list_files
      - fabric_definition_validate
      - sl_list_lakehouses
      - sl_get_lakehouse_tables
      - sl_list_semantic_models
      - sl_get_semantic_model_tables
      - sl_get_semantic_model_definition
      - sl_evaluate_dax
      - sl_list_reports
      - sl_get_report_definition
      - sl_get_refresh_history
      - pbir_validate
      - pbir_visuals
      - pbir_pages
      - pbir_fields
      - scan_report
      - scan_semantic_model
    applicable_when: >-
      Final verification, acceptance verification, quality gates, or checking
      that created Fabric items, semantic models, reports, and visuals work
      and match the user's requested outcome. Use browser screenshot evidence
      for design, style, layout, map, visual-quality, usability, accessibility,
      and championship-report requirements.

  e2e-medallion-architecture:
    name: End-to-end Medallion
    description: >-
      Implement Bronze / Silver / Gold lakehouse patterns with PySpark,
      Delta Lake, and Fabric Pipelines — multi-layer workspace setup,
      data-quality enforcement, orchestration.
    tools:
      - fabric_list_workspaces
      - fabric_list_items
      - fabric_list_folders
      - fabric_diagnose_workspace_artifacts
      - fabric_create_item
      - fabric_create_folder
      - fabric_list_files
      - fabric_read_file
      - fabric_write_file
      - sl_list_lakehouses
      - sl_get_lakehouse_tables
      - sl_run_table_maintenance
      - sl_list_shortcuts
      - sl_create_shortcut
      - sl_list_data_pipelines
      - sl_run_data_pipeline
      - sl_list_warehouses
    applicable_when: >-
      Design or build a Bronze / Silver / Gold lakehouse, a multi-layer
      data platform, or an end-to-end ingestion pipeline.

  check-updates:
    name: Check updates
    description: >-
      Check the Skills for Fabric marketplace for updates. Informational —
      compares local skill versions against upstream releases.
    tools: []
    applicable_when: >-
      User asks whether skills are up-to-date or wants the changelog for
      Skills for Fabric.

  team-orchestration:
    name: Team orchestration
    description: >-
      Coordinator-plane capability owned by the Orchestrator. Covers
      routing work across the team, validating handoffs between phases,
      and expanding the team on demand — i.e. spinning up additional
      agents mid-run when the plan turns out to need a capability that
      isn't on the roster yet (e.g. realising partway through that an
      Admin is needed to provision a workspace). Not backed by an MCP
      tool; exposed via the ``POST /api/sessions/{id}/agents`` control
      endpoint which the Orchestrator (or a human supervisor) calls to
      attach a new ``AgentAssignment`` to the running job.
    tools: []
    applicable_when: >-
      Always applicable to the Orchestrator. Never selected on worker
      agents — those run a single scoped assignment and do not shape
      the team.

  # ── Unique additions from AnalyticsPlatformAgents (3) ────────────

  paginated-report-authoring:
    name: Paginated report authoring
    description: >-
      Author Power BI paginated reports (RDL) — page layout, parameters,
      datasets, deployment to a workspace.
    tools:
      - fabric_list_items
      - fabric_list_folders
      - fabric_create_item
      - fabric_create_folder
      - sl_list_reports
      - sl_get_report_definition
      - sl_clone_report
      - sl_deploy_semantic_model
    applicable_when: >-
      Create or modify a paginated (RDL) report, not an interactive Power
      BI report.

  paginated-report-ops:
    name: Paginated report ops
    description: >-
      Operate paginated reports at scale: list, export, refresh, schedule
      delivery.
    tools:
      - fabric_list_items
      - sl_list_reports
      - sl_export_report
      - sl_refresh_semantic_model
      - sl_get_refresh_history
    applicable_when: >-
      Export, refresh, or manage the lifecycle of paginated reports.

  powerbi-ibcs:
    name: Power BI IBCS
    description: >-
      Apply International Business Communication Standards (IBCS)
      patterns to Power BI reports — consistent variance visuals, colour
      semantics, chart hygiene, layout alignment, and visual design
      review for presentation-ready dashboards.
    tools:
      - scan_report
      - fix_report_bpa
      - fix_ibcs_variance
      - fix_visual_alignment
      - fix_hide_visual_filters
      - fix_remove_unused_custom_visuals
      - pbir_visuals
      - pbir_pages
      - pbir_set
      - pbir_validate
    applicable_when: >-
      User asks for IBCS-compliant reports, variance visualisations,
      strict chart-style hygiene, visual appeal, report design review,
      layout alignment, or presentation-ready dashboards.

  # ── Grounding from the Fabric Local MCP (docs tool only) ─────────
  # Pulled in via the `fabric-docs` server in `mcp_servers.json` with a
  # tool allowlist so the redundant `onelake` / `core` tools (which
  # would clash with our OBO-aware `fabric_*` tools) are not exposed.
  # @microsoft/fabric-mcp exposes `docs` as a single umbrella tool;
  # the actual operation (API spec / workloads / best-practices / etc.)
  # is selected via a parameter on the tool call.

  fabric-api-docs:
    name: Fabric API grounding
    description: >-
      Ground Fabric code generation in the live OpenAPI specs, item
      definitions, and best-practice guidance surfaced by the Microsoft
      Fabric Local MCP `docs` tool.
    tools:
      - docs
    applicable_when: >-
      Before generating code against Fabric REST APIs, designing item
      schemas, or recommending pagination / retry / error-handling
      patterns.

  microsoft-docs:
    name: Microsoft Learn grounding
    description: >-
      Search and fetch current official Microsoft Learn documentation and
      code samples through the Microsoft Learn / Microsoft Docs MCP
      endpoint. Public documentation only; no tenant data or credentials.
    tools:
      - microsoft_docs_search
      - microsoft_docs_fetch
      - microsoft_code_sample_search
    applicable_when: >-
      Use before answering narrow Microsoft technology questions, generating
      Microsoft SDK/API code, checking schema details, or troubleshooting
      product behavior where current Microsoft documentation matters.

  fabric-remote-core:
    name: Fabric Remote Core operations
    description: >-
      Operate live Fabric workspaces, items, folders, permissions,
      capacities, item definitions, long-running operations, and item-type
      guidance through Microsoft's cloud-hosted Fabric Core MCP Server.
      Uses the caller's Entra ID / Fabric RBAC context and Fabric Audit Logs.
    tools:
      - list_workspaces
      - get_workspace
      - create_workspace
      - update_workspace
      - delete_workspace
      - add_workspace_role
      - list_workspace_roles
      - get_workspace_role
      - update_workspace_role
      - delete_workspace_role
      - list_items
      - get_item
      - create_item
      - update_item
      - delete_item
      - get_item_definition
      - update_item_definition
      - bulk_move_items
      - create_folder
      - list_folders
      - get_folder
      - update_folder
      - delete_folder
      - move_folder
      - list_capacities
      - get_operation_state
      - get_operation_result
      - get_knowledge
    applicable_when: >-
      Use for live Fabric control-plane operations where the official Remote
      MCP should execute under the signed-in user's permissions and audit
      trail. Prefer read-only/list/get tools for verification and planning;
      writes remain governed by AgentHub tool policies.

  # ── Cross-cutting utilities ──────────────────────────────────────
  # The skills below are not tied to a single Fabric workload. They
  # surface MCP servers (`time`, `sequential-thinking`, `web-access`,
  # `code-interpreter`, `workspace-shell`, `azure-management`,
  # `powerbi-modeling-mcp`, `powerbi-design`) that would otherwise be
  # running but unreachable from any agent. Each is bound to the agents
  # in ``agent_skills`` below so every tool the runtime discovers is
  # owned by at least one agent.

  time-utilities:
    name: Time and timezone helpers
    description: >-
      Get the current UTC / local time and convert between IANA
      timezones. Lightweight helpers exposed by the official
      `mcp-server-time` reference server. Useful for SLA reasoning,
      schedule planning, and time-stamping report runs.
    tools:
      - get_current_time
      - convert_time
    applicable_when: >-
      Need the current time, schedule a refresh, reason about an SLA
      window, or convert a timestamp between timezones.

  sequential-thinking:
    name: Structured reasoning
    description: >-
      Step-wise reasoning helper from the official MCP
      `sequential-thinking` server. Encourages the agent to externalise
      a chain of thought before committing to multi-step plans, which
      stabilises planning on long-horizon Fabric work.
    tools:
      - sequentialthinking
    applicable_when: >-
      Tackling a complex multi-step plan, ambiguous requirements, or
      cross-skill orchestration where the agent benefits from an
      explicit reasoning scratchpad.

  web-research:
    name: Web research
    description: >-
      Look up public documentation, blog posts, schema references, and
      changelogs from the open web. Backed by the local `web-access`
      server which guards URLs and trims responses to model-friendly
      sizes.
    tools:
      - web_fetch_url
      - web_search
    applicable_when: >-
      Need to ground a recommendation in current public docs, look up
      Microsoft Learn / Fabric blog content, or check a third-party
      schema reference that isn't in the Fabric MCP knowledge base.

  code-execution:
    name: Sandboxed Python execution
    description: >-
      Run short Python snippets in a sandboxed interpreter to validate
      computations, parse JSON/CSV samples, or prototype transformations
      before committing them to a notebook or pipeline. Backed by the
      local `code-interpreter` MCP server.
    tools:
      - run_python_code
    applicable_when: >-
      Verify a computation, decode/transform a small payload, or
      prototype a snippet before authoring it as a Fabric notebook /
      pipeline activity.

  workspace-shell:
    name: Workspace shell
    description: >-
      Run scoped shell commands inside the AgentHub workspace root for
      developer-loop tasks (running scripts, inspecting tooling output,
      formatting). Backed by the local `workspace-shell` MCP server,
      which constrains the working directory and the command surface.
    tools:
      - run_shell_command
    applicable_when: >-
      Execute a developer-loop command (build, lint, format, run a
      provided script) inside the workspace — never for arbitrary host
      shell access.

  azure-management:
    name: Azure control plane
    description: >-
      Read-only Azure management operations needed to reason about the
      Fabric capacity and surrounding Azure resources: list
      subscriptions / resource groups / resources, inspect role
      assignments, query activity logs and resource health, and
      list / resume Fabric capacities. Backed by the local
      `azure-management` MCP server using the caller's OBO identity.
    tools:
      - azure_list_subscriptions
      - azure_list_resource_groups
      - azure_list_resources
      - azure_get_resource
      - azure_check_permissions
      - azure_list_role_assignments
      - azure_list_role_definitions
      - azure_get_activity_log
      - azure_get_resource_health
      - azure_list_fabric_capacities
      - azure_get_fabric_capacity
      - azure_resume_fabric_capacity
    applicable_when: >-
      Inspect or operate Azure resources surrounding Fabric — capacity
      lifecycle, RBAC validation, activity log triage, or resource
      health checks during admin / architecture work.

  azure-diagnostics:
    name: Azure diagnostics
    description: >-
      Read-only Azure failure triage across resource health, Activity Log,
      Azure Monitor diagnostic settings, metric definitions, recent metrics,
      Fabric capacity resources, RBAC permission checks, and network-adjacent
      inventory such as VNets, NSGs, route tables, private endpoints, DNS,
      gateways, firewalls, load balancers, and public IPs.
    tools:
      - azure_list_subscriptions
      - azure_list_resource_groups
      - azure_list_resources
      - azure_get_resource
      - azure_check_permissions
      - azure_list_role_assignments
      - azure_list_role_definitions
      - azure_get_activity_log
      - azure_get_resource_health
      - azure_list_diagnostic_settings
      - azure_list_metric_definitions
      - azure_query_metrics
      - azure_network_inventory
      - azure_diagnose_resource
      - azure_list_fabric_capacities
      - azure_get_fabric_capacity
    applicable_when: >-
      Diagnose Azure-side failures: capacity paused/unhealthy, provisioning
      failures, missing metrics/logs, failed recent operations, RBAC denials,
      network connectivity risks, or any Fabric workload issue that may be
      rooted in the surrounding Azure control plane.

  azure-mcp-guidance:
    name: Azure MCP guidance
    description: >-
      Current read-only Azure guidance from the official Azure MCP Server,
      limited to best-practice tools for Azure resources and Azure AI agent
      applications. Live Azure resource operations stay on the OBO-backed
      `azure-management` and `azure-diagnostics` tools.
    tools:
      - get_azure_bestpractices_get
      - get_azure_bestpractices_ai_app
    applicable_when: >-
      Use before implementing Azure-facing agent features, deployment plans,
      Azure AI workflows, or recommendations where current Azure MCP
      best-practice guidance should shape the answer.

  entra-identity-diagnostics:
    name: Entra identity diagnostics
    description: >-
      Diagnose identity and permission failures through token audience / claim
      inspection, signed-in user lookup, user and service-principal lookup,
      group membership, app-role assignments, Azure RBAC role assignments, and
      effective Azure permission checks. Token diagnostics never expose token
      values.
    tools:
      - entra_token_diagnostics
      - entra_get_signed_in_user
      - entra_get_user
      - entra_get_service_principal
      - entra_diagnose_principal_access
      - entra_list_group_memberships
      - entra_list_app_role_assignments
      - azure_check_permissions
      - azure_list_role_assignments
      - azure_list_role_definitions
    applicable_when: >-
      Diagnose 401/403, wrong audience, app-only vs delegated identity,
      owner mismatch, owners who left the org or were disabled, missing
      consent, missing group membership, service-principal confusion, or
      role-assignment gaps in Fabric, Power BI, Azure, or Entra ID.

  fabric-powerbi-diagnostics:
    name: Fabric and Power BI diagnostics
    description: >-
      Broad read-only diagnostics for Fabric and Power BI artifacts we create:
      workspace/item metadata, roles, capacity, operation state, definitions,
      refresh history, semantic-model queryability, Lakehouse/Warehouse/KQL
      inventory, PBIR validation, report renderability, browser evidence, and
      governance scans.
    tools:
      - fabric_list_workspaces
      - fabric_list_items
      - fabric_list_folders
      - fabric_validate_workspace_capacity
      - fabric_diagnose_workspace_artifacts
      - fabric_verify_report_renderable
      - fabric_verify_workspace_inventory_solution
      - fabric_get_semantic_model_refresh_history
      - browser_verify_visual_render
      - list_workspaces
      - get_workspace
      - list_workspace_roles
      - list_items
      - get_item
      - get_item_definition
      - list_capacities
      - get_operation_state
      - get_operation_result
      - sl_list_lakehouses
      - sl_get_lakehouse_tables
      - sl_list_warehouses
      - sl_list_sql_endpoints
      - sl_list_mirrored_databases
      - sl_get_mirroring_status
      - sl_list_semantic_models
      - sl_get_semantic_model_tables
      - sl_get_semantic_model_definition
      - sl_evaluate_dax
      - sl_get_refresh_history
      - sl_list_reports
      - sl_get_report_definition
      - pbir_validate
      - pbir_visuals
      - pbir_pages
      - pbir_fields
      - pbir_report
      - scan_report
      - scan_semantic_model
      - scan_workspaces
    applicable_when: >-
      Diagnose anything Fabric or Power BI related: broken created items,
      missing folders, stale or failed refresh, semantic model errors, report
      loading/render/export failures, PBIR definition issues, capacity gaps,
      workspace role problems, or artifact quality regressions.

  powerbi-modeling:
    name: Power BI semantic-model authoring (Microsoft MCP)
    description: >-
      Author Power BI semantic models through Microsoft's official
      `powerbi-modeling-mcp` server, which talks to the Analysis
      Services engine directly: create / alter tables, columns,
      measures, relationships, partitions, calculation groups, security
      roles, and validate DAX. Use this in preference to hand-rolling
      TMDL/TMSL whenever the modeler is available.
    tools:
      - database_operations
      - model_operations
      - table_operations
      - column_operations
      - measure_operations
      - named_expression_operations
      - function_operations
      - object_translation_operations
      - relationship_operations
      - dax_query_operations
      - partition_operations
      - calculation_group_operations
      - security_role_operations
      - calendar_operations
      - query_group_operations
      - user_hierarchy_operations
      - culture_operations
      - perspective_operations
      - connection_operations
      - transaction_operations
      - trace_operations
    applicable_when: >-
      Create or modify a Power BI semantic model — tables, columns,
      measures, relationships, partitions, calculation groups, security
      roles — or validate DAX through the Microsoft modeling MCP.

  powerbi-design:
    name: Power BI report design (powerbi-creator-skill)
    description: >-
      Author and modernise Power BI reports through the third-party
      `powerbi-creator-skill` Design MCP server. Covers visual CRUD, theme
      injection, conditional formatting, layout/overlap validation, style
      guides, audit logging, and backups. Use it for championship-level
      hierarchy, 3-30-300 flow, interactions/tooltips, accessibility, modern
      themes, source/methodology transparency, and avoiding default one-card
      shells.
    # The upstream package must be cloned to
    # ``${WORKSPACE_ROOT}/external/powerbi-creator-skill`` for the
    # server to start. ``MCPClientManager`` fails startup if the path
    # is missing, because agents must not run with a partial MCP stack.
    tools:
      - analyze_report_structure
      - get_report_assets
      - apply_style_guide
      - patch_report_properties
      - patch_page_properties
      - patch_visual_properties
      - replace_theme_resource
      - validate_report_definition
      - preview_changes
      - diff_report_definition
      - update_report_definition
      - backup_report_definition
      - score_modernization_readiness
      - bulk_apply_style_guide
      - extract_style_guide_from_report
      - add_visual_to_page
      - rearrange_page_visuals
      - add_image_visual
      - build_page
      - get_default_style_guide
      - set_default_style_guide
      - get_audit_log
      - list_backups
      - restore_report_definition
      - apply_full_style
      - add_page
      - reorder_pages
      - full_modernization
      - inject_custom_theme
      - apply_conditional_format
      - remove_visual
      - remove_page
      - rename_visual
      - get_semantic_model_schema
      - suggest_visuals
      - auto_layout
      - compare_reports
      - export_report_summary
    applicable_when: >-
      Authoring or polishing Power BI report visuals, themes,
      conditional formatting, layouts, page management, or running
      bulk style-guide modernisation. Prefer this over hand-editing
      visual.json, especially when a generated report must qualify from
      UI/UX/design/usability and screenshot-review perspectives. Pair with
      `powerbi-modeling` for the model side.

  fabric-admin-operations:
    name: Fabric tenant and workspace administration
    description: >-
