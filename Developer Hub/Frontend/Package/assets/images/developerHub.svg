<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E90FF"/>
      <stop offset="55%" stop-color="#5B5BFF"/>
      <stop offset="100%" stop-color="#8B3DFF"/>
    </linearGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F4FF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded-square tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="url(#bg)"/>

  <!-- Subtle inner highlight ring -->
  <rect x="8" y="8" width="1008" height="1008" rx="174" ry="174"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <!-- Origami / paper-plane mark -->
  <g filter="url(#softShadow)">
    <!-- Lit (upper) face -->
    <path d="M 900,470 L 140,170 L 520,530 L 200,830 Z" fill="url(#paper)"/>
    <!-- Folded (lower) face — shadow side -->
    <path d="M 900,470 L 520,530 L 200,830 Z" fill="#B8C5F2"/>
    <!-- Crease highlight -->
    <path d="M 900,470 L 520,530" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.85"/>
  </g>
</svg>
