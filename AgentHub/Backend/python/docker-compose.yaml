# DEPRECATED: Use the root docker-compose.yaml instead:
#   cd ../.. && docker compose up
#
# This file is kept only for backward compatibility. 
# The root docker-compose.yaml runs both backend and frontend.

version: '3.8'
services:
  fabric-backend:
    build:
      context: .
      target: production
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ../../.env
    volumes:
      - ./src/appsettings.json:/app/src/appsettings.json:ro
      - ./src/appsettings.Development.json:/app/src/appsettings.Development.json:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s