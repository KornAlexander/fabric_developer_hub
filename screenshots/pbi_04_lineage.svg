<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f5f5f5; }
      .header { fill: #1f2937; }
      .header-text { fill: white; font-size: 16px; font-weight: bold; }
      .panel-bg { fill: white; stroke: #e5e7eb; stroke-width: 1; }
      .section-title { fill: #1f2937; font-size: 14px; font-weight: 600; }
      .node-report { fill: #fef3c7; stroke: #fcd34d; stroke-width: 2; }
      .node-visual { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; }
      .node-column { fill: #d1fae5; stroke: #10b981; stroke-width: 2; }
      .node-measure { fill: #fed7aa; stroke: #f97316; stroke-width: 2; }
      .edge { stroke: #9ca3af; stroke-width: 2; fill: none; }
      .edge-active { stroke: #3b82f6; stroke-width: 3; fill: none; }
      .node-label { font-size: 11px; font-weight: 600; }
      .impact-badge { font-size: 9px; font-weight: 600; fill: white; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect class="bg" width="1200" height="700"/>
  
  <!-- Header -->
  <rect class="header" width="1200" height="60"/>
  <text class="header-text" x="20" y="38">Report &amp; Lineage Explorer — Column Usage &amp; Impact Analysis</text>
  
  <!-- Left Panel: Report/Column Selector -->
  <rect class="panel-bg" x="20" y="80" width="220" height="600"/>
  <text class="section-title" x="30" y="105">Reports &amp; Columns</text>
  
  <!-- Search -->
  <rect fill="#f3f4f6" x="25" y="115" width="210" height="25" rx="2" stroke="#e5e7eb" stroke-width="1"/>
  <text style="font-size: 11px; fill: #6b7280;" x="35" y="134">🔍 Search...</text>
  
  <!-- Report List -->
  <text style="font-size: 11px; font-weight: 600; fill: #1f2937;" x="30" y="160">Reports (3)</text>
  
  <rect fill="#fef3c7" x="25" y="170" width="210" height="45" rx="2" stroke="#fcd34d" stroke-width="2"/>
  <text style="font-size: 12px; font-weight: 600; fill: #92400e;" x="35" y="190">📊 Sales Dashboard</text>
  <text style="font-size: 10px; fill: #b45309;" x="35" y="205">Pages: 4 • Visuals: 23</text>
  
  <rect fill="white" x="25" y="220" width="210" height="45" rx="2" stroke="#e5e7eb" stroke-width="1"/>
  <text style="font-size: 12px; font-weight: 600; fill: #1f2937;" x="35" y="240">📊 Exec Summary</text>
  <text style="font-size: 10px; fill: #6b7280;" x="35" y="255">Pages: 2 • Visuals: 8</text>
  
  <rect fill="white" x="25" y="270" width="210" height="45" rx="2" stroke="#e5e7eb" stroke-width="1"/>
  <text style="font-size: 12px; font-weight: 600; fill: #1f2937;" x="35" y="290">📊 Regional View</text>
  <text style="font-size: 10px; fill: #6b7280;" x="35" y="305">Pages: 3 • Visuals: 12</text>
  
  <!-- Column Usage Stats -->
  <text style="font-size: 11px; font-weight: 600; fill: #1f2937;" x="30" y="340">Column Usage</text>
  
  <rect fill="white" x="25" y="350" width="210" height="70" rx="2" stroke="#10b981" stroke-width="2"/>
  <text style="font-size: 12px; font-weight: 600; fill: #059669;" x="35" y="370">✓ SalesAmount</text>
  <text style="font-size: 10px; fill: #6b7280;" x="35" y="385">Used in: 12 visuals (8 reports)</text>
  <text style="font-size: 9px; fill: #059669;" x="35" y="398">🔥 Hot • Active</text>
  
  <rect fill="white" x="25" y="425" width="210" height="70" rx="2" stroke="#ef4444" stroke-width="2"/>
  <text style="font-size: 12px; font-weight: 600; fill: #991b1b;" x="35" y="445">⚠️ InternalCode</text>
  <text style="font-size: 10px; fill: #6b7280;" x="35" y="460">Used in: 0 visuals</text>
  <text style="font-size: 9px; fill: #991b1b;" x="35" y="473">❌ Orphaned (Remove?)</text>
</g>
  
  <!-- Middle Panel: Lineage Graph -->
  <rect class="panel-bg" x="250" y="80" width="700" height="600"/>
  <text class="section-title" x="260" y="105">Lineage: Sales Dashboard → Semantic Model</text>
  
  <!-- Report Level -->
  <rect class="node-report" x="300" y="140" width="120" height="40" rx="3"/>
  <text class="node-label" x="315" y="165">📊 Sales Dashboard</text>
  
  <!-- Visuals -->
  <g>
    <!-- Visual 1 -->
    <line class="edge-active" x1="420" y1="160" x2="500" y2="160"/>
    <rect class="node-visual" x="500" y="135" width="100" height="50" rx="3"/>
    <text class="node-label" x="515" y="160">Visual: Chart</text>
    <text style="font-size: 9px; fill: #1e40af;" x="515" y="175">Total Sales Trend</text>
    
    <!-- Visual 2 -->
    <line class="edge" x1="420" y1="180" x2="500" y2="220"/>
    <rect class="node-visual" x="500" y="195" width="100" height="50" rx="3"/>
    <text class="node-label" x="515" y="220">Visual: Table</text>
    <text style="font-size: 9px; fill: #1e40af;" x="515" y="235">Customer List</text>
    
    <!-- Visual 3 -->
    <line class="edge" x1="420" y1="180" x2="500" y2="280"/>
    <rect class="node-visual" x="500" y="255" width="100" height="50" rx="3"/>
    <text class="node-label" x="515" y="280">Visual: Slicer</text>
    <text style="font-size: 9px; fill: #1e40af;" x="515" y="295">Region Filter</text>
  </g>
  
  <!-- Columns/Measures -->
  <g>
    <!-- From Visual 1 to Columns -->
    <line class="edge-active" x1="600" y1="160" x2="650" y2="160"/>
    <rect class="node-measure" x="650" y="135" width="100" height="50" rx="3"/>
    <text class="node-label" x="660" y="160">⚙️ Total Sales</text>
    <text style="font-size: 9px; fill: #92400e;" x="660" y="175">(Measure)</text>
    
    <!-- From Visual 2 to Columns -->
    <line class="edge" x1="600" y1="220" x2="650" y2="220"/>
    <rect class="node-column" x="650" y="195" width="100" height="50" rx="3"/>
    <text class="node-label" x="660" y="220">CustomerName</text>
    <text style="font-size: 9px; fill: #065f46;" x="665" y="235">(Column)</text>
    
    <!-- From Visual 3 to Columns -->
    <line class="edge" x1="600" y1="280" x2="650" y2="280"/>
    <rect class="node-column" x="650" y="255" width="100" height="50" rx="3"/>
    <text class="node-label" x="665" y="280">Country</text>
    <text style="font-size: 9px; fill: #065f46;" x="670" y="295">(Column)</text>
  </g>
  
  <!-- Semantic Model Tables -->
  <g>
    <!-- Sales Table -->
    <line class="edge-active" x1="750" y1="160" x2="800" y2="160"/>
    <rect class="node-column" x="800" y="125" width="90" height="70" rx="3"/>
    <text style="font-size: 12px; font-weight: 600; fill: #065f46;" x="810" y="148">Sales</text>
    <text style="font-size: 10px; fill: #059669;" x="810" y="163">⚙️ Total Sales</text>
    <text style="font-size: 10px; fill: #059669;" x="810" y="178">Amount</text>
    <text style="font-size: 10px; fill: #059669;" x="810" y="185">Quantity</text>
    
    <!-- Customers Table -->
    <line class="edge" x1="750" y1="220" x2="800" y2="220"/>
    <rect class="node-column" x="800" y="195" width="90" height="70" rx="3"/>
    <text style="font-size: 12px; font-weight: 600; fill: #065f46;" x="810" y="218">Customers</text>
    <text style="font-size: 10px; fill: #059669;" x="810" y="233">CustomerID</text>
    <text style="font-size: 10px; fill: #059669;" x="810" y="248">CustomerName</text>
    <text style="font-size: 10px; fill: #059669;" x="810" y="255">Country</text>
  </g>
  
  <!-- Relationship edge -->
  <line class="edge" x1="890" y1="160" x2="890" y2="195" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Right Panel: Impact & Recommendations -->
  <rect class="panel-bg" x="960" y="80" width="220" height="600"/>
  <text class="section-title" x="970" y="105">Impact Analysis</text>
  
  <rect fill="#eff6ff" x="965" y="120" width="210" height="100" rx="3"/>
  <text style="font-size: 11px; font-weight: 600; fill: #1e40af;" x="975" y="140">🔥 Hot Columns</text>
  <text style="font-size: 10px; fill: #1e40af; margin-top: 5;" x="975" y="157">SalesAmount (12 uses)</text>
  <text style="font-size: 10px; fill: #1e40af;" x="975" y="172">CustomerID (8 uses)</text>
  <text style="font-size: 10px; fill: #1e40af;" x="975" y="187">OrderDate (6 uses)</text>
  <text style="font-size: 10px; fill: #1e40af;" x="975" y="202">Country (5 uses)</text>
  
  <rect fill="#fee2e2" x="965" y="225" width="210" height="100" rx="3"/>
  <text style="font-size: 11px; font-weight: 600; fill: #991b1b;" x="975" y="245">❌ Orphaned</text>
  <text style="font-size: 10px; fill: #991b1b;" x="975" y="262">InternalCode (0 uses)</text>
  <text style="font-size: 10px; fill: #991b1b;" x="975" y="277">LegacyID (0 uses)</text>
  <text style="font-size: 10px; fill: #991b1b;" x="975" y="292">DeprecatedField (0 uses)</text>
  <text style="font-size: 9px; fill: #6b7280; margin-top: 3;" x="975" y="309">Consider removal</text>
  
  <rect fill="#dbeafe" x="965" y="330" width="210" height="100" rx="3"/>
  <text style="font-size: 11px; font-weight: 600; fill: #1e40af;" x="975" y="350">ℹ️ Change Impact</text>
  <text style="font-size: 9px; fill: #1e40af;" x="975" y="367">If SalesAmount changed:</text>
  <text style="font-size: 9px; fill: #1e40af;" x="985" y="380">• 12 visuals affected</text>
  <text style="font-size: 9px; fill: #1e40af;" x="985" y="393">• 3 reports impacted</text>
  <text style="font-size: 9px; fill: #1e40af;" x="985" y="406">• 2 dashboards broken</text>
  <text style="font-size: 9px; fill: #6b7280;" x="975" y="423">Recommendation: Tag as critical</text>
  
  <rect fill="#d1fae5" x="965" y="435" width="210" height="100" rx="3"/>
  <text style="font-size: 11px; font-weight: 600; fill: #065f46;" x="975" y="455">✓ Recommendations</text>
  <text style="font-size: 10px; fill: #065f46;" x="975" y="472">1. Add descriptions to</text>
  <text style="font-size: 10px; fill: #065f46;" x="980" y="485">   hot columns (12)</text>
  <text style="font-size: 10px; fill: #065f46;" x="975" y="500">2. Create hierarchies for</text>
  <text style="font-size: 10px; fill: #065f46;" x="980" y="513">   geography drill-down</text>
  <text style="font-size: 10px; fill: #065f46;" x="975" y="528">3. Archive unused columns</text>
</svg>