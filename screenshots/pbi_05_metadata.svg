      .table-cell { font-size: 10px; fill: #374151; }
      .export-btn { fill: #3b82f6; }
      .btn-text { fill: white; font-size: 12px; font-weight: 600; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect class="bg" width="1200" height="700"/>
  
