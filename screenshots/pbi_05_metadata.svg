    <rect class="export-btn" x="350" y="92" width="80" height="25" rx="3"/>
    <text class="btn-text" x="365" y="111">📊 CSV</text>
    
    <rect class="export-btn" x="440" y="92" width="80" height="25" rx="3"/>
    <text class="btn-text" x="455" y="111">📋 Excel</text>
    
    <rect class="export-btn" x="530" y="92" width="100" height="25" rx="3"/>
