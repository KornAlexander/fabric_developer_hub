name: Frontend New Session E2E

on:
  pull_request:
    paths:
      - "Developer Hub/Frontend/**"
      - ".github/workflows/frontend-new-session-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "Developer Hub/Frontend/**"
      - ".github/workflows/frontend-new-session-e2e.yml"

jobs:
  new-session-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Developer Hub/Frontend"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "Developer Hub/Frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start frontend harness
        run: |
          printf 'WORKLOAD_BE_URL=http://127.0.0.1:5000\n' > ../.env
          npx env-cmd -f ../.env webpack serve --config ./tools/webpack.config.js --host 127.0.0.1 --port 60006 > /tmp/agenthub-frontend.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:60006 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/agenthub-frontend.log
          exit 1

      - name: Run focused New Session E2E
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:60006
        run: npm run test:e2e:new-session

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-session-playwright-artifacts
          path: |
            Developer Hub/Frontend/test-results
            Developer Hub/docs/screenshots/new-session-flow
